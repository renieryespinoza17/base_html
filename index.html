  <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="https://google.com/">Google</a></li>
                <li><a href="abaout.html">Abaout</a></li>
            </ul>
        </nav>
        <h1 style="color:blue">Welcome to My Website</h1>
    </header>
    <main>
        <p>This is a simple paragraph</p>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass">
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br>
            <input type="checkbox" id="suscribe" name="suscribe">
            <label for="suscribe">suscribe to newaletter</label>
            <br>
            <optgroup label="Fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="orange">Orange</option>
            </optgroup>
            <input type="radio" id="opc1" id="opc1">
            <label for="opc1">Option 1</label>
            <input type="radio" id="opc2" id="opc2">
            <label for="opc2">Option 2</label>
            <br>

            <textarea id="message" name="message" rows="10" cols="50"></textarea>
            <br>

            <label for="num">Number:</label>
            <input type="=number" id="num" name="num" min="1" max="10">
            <br>
            <label for="dat">Date:</label>
            <input type="date" id="dat" name="dat">
            <br>
            <input type="file" id="fil" name="fil">
            <input type="range" id="ran" name="ran">
            <input type="color" id="col" name="col">
            <br>
            <input type="tel" id="cel" name="cel">
            <input type="time" id="tim" name="tim">
            <input type="search" id="sc" name="sc">
            <!--Tablas-->
            <table>
                <thead>
                    <tr>
                        <th>Header 1</th>
                        <th>Header 2</th>
                        <th>Header 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Data 1</td>
                        <td>Data 2</td>
                        <td>Data 3</td>
                    </tr>
                    <tr>
                        <td>Data 4</td>
                        <td>Data 5</td>
                        <td>Data 6</td>
                    </tr>
                </tbody>
            </table>


            <br>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>
</body>

</html>
